name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: document_service_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d document_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install .[dev]

      - name: Run migrations up
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/document_service_test
        run: alembic upgrade head

      - name: Run migrations down
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/document_service_test
        run: alembic downgrade base

      - name: Run migrations up again
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/document_service_test
        run: alembic upgrade head

      - name: Verify migration integrity
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/document_service_test
        run: |
          python -c "
          from infrastructure.database import Base
          from infrastructure.models import DocumentModel, IdempotencyKeyModel
          print('Metadata tables:', list(Base.metadata.tables.keys()))
          assert 'documents' in Base.metadata.tables
          assert 'idempotency_keys' in Base.metadata.tables
          print('✓ Migration integrity verified')
          "

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5433/document_service_test
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=95
