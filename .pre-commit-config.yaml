repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        language_version: python3.12
        additional_dependencies:
          - fastapi==0.111.0
          - uvicorn==0.30.1
          - pydantic-settings==2.2.1
          - sqlalchemy==2.0.30
          - psycopg[binary]==3.1.18
          - alembic==1.18.4
          - pytest==8.2.2

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-q", "-x", "src/tests"]

  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog (docker)
        entry: bash -c 'docker run --rm -v "$(pwd):/workdir" -w /workdir -e PRE_COMMIT="${PRE_COMMIT:-}" -e TRUFFLEHOG_PRE_COMMIT=1 trufflesecurity/trufflehog:3.63.2 git file:///workdir --fail --no-update'
        language: system

      - id: block-main-branch
        name: Block commits to main
        entry: bash -c 'if [[ "${CI:-}" == "true" ]]; then exit 0; fi; if [[ "$(git rev-parse --abbrev-ref HEAD)" == "main" ]]; then echo "🚫 Direct commits to main are blocked."; exit 1; fi'
        language: system
        stages: [commit]
