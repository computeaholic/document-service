services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: document_service_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://test:test@postgres:5432/document_service_test
    depends_on:
      - postgres
    ports:
      - "8000:8000"
